<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario de Inglés</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--txt:#1d2433;--muted:#6b7280;--pri:#2952cc;--ok:#1f9d55;--ko:#d64545;--bd:#e3e6ee}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212b;--txt:#e8ebf2;--muted:#9aa3b2;--pri:#6b8cff;--ok:#3ecf7f;--ko:#ff6b6b;--bd:#2c3341}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.label{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:transparent;color:var(--txt);border-radius:999px;padding:8px 14px;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
button.big{width:100%;padding:14px;border:none;border-radius:12px;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer;margin-top:8px}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
.word{font-size:1.9rem;font-weight:700;text-align:center;margin:18px 0 6px;word-break:break-word}
.hint{text-align:center;color:var(--muted);font-size:.9rem}
.answer{font-size:1.4rem;text-align:center;margin:10px 0;font-weight:600}
.ex{font-style:italic;color:var(--muted);text-align:center;margin-top:6px}
input[type=text]{width:100%;padding:14px;font-size:1.1rem;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--txt);font-size:1.05rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(31,157,85,.15)}
.opt.ko{border-color:var(--ko);background:rgba(214,69,69,.15)}
.fb{text-align:center;font-weight:700;margin:12px 0 4px;font-size:1.1rem}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar>div{height:100%;background:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.link{background:none;border:none;color:var(--pri);cursor:pointer;font-size:.95rem;padding:4px 0}
.hidden{display:none}
.stat{font-size:2.6rem;font-weight:800;text-align:center}
ul.list{padding-left:18px;margin:6px 0;line-height:1.6}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== CONFIGURACIÓN: enlace CSV de la hoja publicada ======
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRxgXXT3B4uRw_nRsbZG44Ue5EimXEHAZtPZwXh65X3nP1CfQ5MEiUD-S44t1M8W5UgkKlzVSXRc6Cj/pub?gid=0&single=true&output=csv";
// ============================================================

const LS_FAILS = "vocab_fallos_v1", LS_CACHE = "vocab_cache_v1";
const app = document.getElementById("app");
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let words = [], units = [], sel = new Set(), dir = "en-es", mode = "write", onlyFails = false, notice = "";
let fails = lsGet(LS_FAILS, {});
let queue = [], current = null, total = 0, doneSet = new Set(), sessionFails = new Set(), firstTryOk = 0;
let answered = false, prevFail = 0, wasFirst = false, poolAll = [];

// ---------- CSV ----------
function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const headerKey = s => s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function setWords(text){
  const rows = parseCSV(text);
  if(!rows.length) throw new Error("vacío");
  const h = rows[0].map(headerKey);
  const idx = (names, d) => { const i = h.findIndex(x => names.includes(x)); return i >= 0 ? i : d; };
  const iU = idx(["unidad","clase","tema"], 0), iEn = idx(["ingles","english"], 1),
        iEs = idx(["espanol","castellano","spanish"], 2), iEx = idx(["ejemplo","example"], 3);
  if(!h.includes("ingles") && !h.includes("english")) throw new Error("cabeceras");
  const seen = new Set();
  words = rows.slice(1).map(r => ({
    unit: (r[iU] || "").trim() || "Sin unidad",
    en: (r[iEn] || "").trim(), es: (r[iEs] || "").trim(), ex: (r[iEx] || "").trim()
  })).filter(w => w.en && w.es).map(w => {
    let id = w.unit + "|" + w.en; while(seen.has(id)) id += "*"; seen.add(id);
    return {...w, id};
  });
  units = [...new Set(words.map(w => w.unit))].sort((a,b) => a.localeCompare(b, "es", {numeric:true}));
}

// ---------- Corrección ----------
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[’`´]/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim().replace(/^to /, "");
const alts = cell => cell.split(/[\/;]/).map(s => s.trim()).filter(Boolean);
function matches(v, cell){
  const nv = norm(v), al = alts(cell);
  const ok = al.some(x => norm(x) === nv);
  const lv = v.trim().toLowerCase().replace(/\s+/g, " ");
  const exact = al.some(x => x.toLowerCase().replace(/\s+/g, " ") === lv);
  return {ok, exact};
}
const q = w => dir === "en-es" ? w.en : w.es;
const a = w => dir === "en-es" ? w.es : w.en;

// ---------- Inicio ----------
const poolFor = () => words.filter(w => sel.has(w.unit) && (!onlyFails || (fails[w.id] || 0) > 0));
function home(){
  const nf = words.filter(w => sel.has(w.unit) && (fails[w.id] || 0) > 0).length;
  const n = poolFor().length;
  app.innerHTML = `<h1>Vocabulario de inglés</h1>
  <div class="card"><div class="label">Unidades</div><div class="chips">
    <button class="chip ${sel.size === units.length ? "on" : ""}" data-all="1">Todas</button>
    ${units.map(u => `<button class="chip ${sel.has(u) ? "on" : ""}" data-u="${esc(u)}">${esc(u)}</button>`).join("")}
  </div></div>
  <div class="card"><div class="label">Dirección</div><div class="chips">
    <button class="chip ${dir === "en-es" ? "on" : ""}" data-d="en-es">Inglés → Español</button>
    <button class="chip ${dir === "es-en" ? "on" : ""}" data-d="es-en">Español → Inglés</button>
  </div></div>
  <div class="card"><div class="label">Modo</div><div class="chips">
    <button class="chip ${mode === "cards" ? "on" : ""}" data-m="cards">Tarjetas</button>
    <button class="chip ${mode === "write" ? "on" : ""}" data-m="write">Escribir</button>
    <button class="chip ${mode === "test" ? "on" : ""}" data-m="test">Test</button>
  </div></div>
  <div class="card"><label style="display:flex;gap:10px;align-items:center;cursor:pointer">
    <input type="checkbox" id="of" ${onlyFails ? "checked" : ""}> Solo palabras falladas (${nf})</label></div>
  <button class="big" id="go" ${n ? "" : "disabled"}>Empezar (${n} palabra${n === 1 ? "" : "s"})</button>
  ${notice ? `<p class="hint">${esc(notice)}</p>` : ""}
  <p class="hint"><button class="link" id="rf">Borrar historial de fallos</button></p>`;

  $$("[data-u]").forEach(b => b.onclick = () => { const u = b.dataset.u; sel.has(u) ? sel.delete(u) : sel.add(u); home(); });
  $("[data-all]").onclick = () => { sel = sel.size === units.length ? new Set() : new Set(units); home(); };
  $$("[data-d]").forEach(b => b.onclick = () => { dir = b.dataset.d; home(); });
  $$("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; home(); });
  $("#of").onchange = e => { onlyFails = e.target.checked; home(); };
  $("#go").onclick = () => start(poolFor());
  $("#rf").onclick = () => { if(confirm("¿Borrar el historial de palabras falladas?")){ fails = {}; lsSet(LS_FAILS, fails); home(); } };
}

// ---------- Sesión ----------
function start(list){
  poolAll = words.filter(w => sel.has(w.unit));
  queue = shuffle(list.slice()); total = list.length;
  doneSet = new Set(); sessionFails = new Set(); firstTryOk = 0;
  next();
}
function next(){
  if(!queue.length) return results();
  current = queue.shift(); answered = false;
  if(mode === "cards") renderCards(); else if(mode === "write") renderWrite(); else renderTest();
}
function grade(ok){
  answered = true;
  const id = current.id; prevFail = fails[id] || 0; wasFirst = !sessionFails.has(id);
  if(ok){
    if(wasFirst) firstTryOk++;
    doneSet.add(id);
    if(fails[id]){ fails[id]--; if(!fails[id]) delete fails[id]; }
  } else {
    sessionFails.add(id);
    fails[id] = (fails[id] || 0) + 1;
    // La palabra fallada vuelve a salir unas posiciones más adelante
    queue.splice(Math.min(queue.length, 3 + Math.floor(Math.random() * 3)), 0, current);
  }
  lsSet(LS_FAILS, fails);
}
function override(){
  const id = current.id, i = queue.indexOf(current);
  if(i >= 0) queue.splice(i, 1);
  if(prevFail > 1) fails[id] = prevFail - 1; else delete fails[id];
  if(wasFirst){ sessionFails.delete(id); firstTryOk++; }
  doneSet.add(id); lsSet(LS_FAILS, fails); next();
}
function header(){
  const p = total ? Math.round(doneSet.size / total * 100) : 0;
  return `<div class="top"><button class="link" id="exit">✕ Salir</button><span>${doneSet.size}/${total}</span></div>
  <div class="bar"><div style="width:${p}%"></div></div>`;
}
const bindExit = () => { $("#exit").onclick = home; };
const exHTML = () => current.ex ? `<div class="ex">${esc(current.ex)}</div>` : "";

function renderCards(){
  app.innerHTML = header() + `<div class="card"><div class="word">${esc(q(current))}</div>
    <div id="back" class="hidden"><div class="answer">${esc(a(current))}</div>${exHTML()}</div>
    <p class="hint" id="tip">Piensa la respuesta antes de girar</p></div>
    <button class="big" id="flip">Mostrar respuesta</button>
    <div class="row hidden" id="gr"><button class="big sec" id="no">No la sabía</button><button class="big" id="yes">La sabía</button></div>`;
  bindExit();
  $("#flip").onclick = () => { $("#back").classList.remove("hidden"); $("#tip").classList.add("hidden");
    $("#flip").classList.add("hidden"); $("#gr").classList.remove("hidden"); };
  $("#yes").onclick = () => { grade(true); next(); };
  $("#no").onclick = () => { grade(false); next(); };
}

function renderWrite(){
  app.innerHTML = header() + `<div class="card"><div class="word">${esc(q(current))}</div>
    <p class="hint">Escribe la traducción en ${dir === "en-es" ? "español" : "inglés"}</p>
    <input type="text" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="fb"></div></div>
    <button class="big" id="chk">Comprobar</button>`;
  bindExit();
  const inp = $("#in"); inp.focus();
  inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); answered ? next() : check(); } };
  $("#chk").onclick = () => answered ? next() : check();
}
function check(){
  const v = $("#in").value; if(!v.trim()) return;
  const r = matches(v, a(current)); grade(r.ok);
  $("#in").readOnly = true;
  let h = r.ok
    ? `<div class="fb ok">✓ Correcto</div>${r.exact ? "" : `<p class="hint">Forma exacta: <b>${esc(a(current))}</b></p>`}`
    : `<div class="fb ko">✗ Incorrecto</div><div class="answer">${esc(a(current))}</div>`;
  h += exHTML();
  if(!r.ok) h += `<p class="hint"><button class="link" id="ovr">Mi respuesta era válida: contar como bien</button></p>`;
  $("#fb").innerHTML = h;
  $("#chk").textContent = "Siguiente";
  const o = $("#ovr"); if(o) o.onclick = override;
}

function renderTest(){
  const correct = a(current), nc = norm(correct);
  let cand = shuffle(poolAll.filter(w => w.id !== current.id).map(a));
  if(cand.length < 3) cand = cand.concat(shuffle(words.filter(w => w.id !== current.id).map(a)));
  const dist = [];
  for(const c of cand){ if(norm(c) !== nc && !dist.some(d => norm(d) === norm(c))) dist.push(c); if(dist.length === 3) break; }
  const opts = shuffle([correct, ...dist]);
  app.innerHTML = header() + `<div class="card"><div class="word">${esc(q(current))}</div>
    ${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}
    <div id="fb"></div></div>
    <button class="big hidden" id="nx">Siguiente</button>`;
  bindExit();
  $$(".opt").forEach(b => b.onclick = () => {
    if(answered) return;
    const ok = opts[+b.dataset.i] === correct; grade(ok);
    $$(".opt").forEach(x => { if(opts[+x.dataset.i] === correct) x.classList.add("ok"); });
    if(!ok) b.classList.add("ko");
    $("#fb").innerHTML = exHTML();
    const n = $("#nx"); n.classList.remove("hidden"); n.onclick = next; n.focus();
  });
}

function results(){
  const failed = words.filter(w => sessionFails.has(w.id));
  const pct = total ? Math.round(firstTryOk / total * 100) : 0;
  app.innerHTML = `<h1>Resultado</h1>
  <div class="card"><div class="stat">${pct}%</div><p class="hint">${firstTryOk} de ${total} a la primera</p></div>
  ${failed.length
    ? `<div class="card"><div class="label">A repasar</div><ul class="list">${failed.map(w => `<li><b>${esc(w.en)}</b> — ${esc(w.es)}</li>`).join("")}</ul></div>
       <button class="big" id="rep">Repasar estas ${failed.length}</button>`
    : `<div class="card"><p class="hint">Ningún fallo. Buen trabajo.</p></div>`}
  <button class="big sec" id="home">Volver al inicio</button>`;
  const r = $("#rep"); if(r) r.onclick = () => start(failed);
  $("#home").onclick = home;
}

// ---------- Carga ----------
async function load(){
  app.innerHTML = `<p class="hint">Cargando vocabulario…</p>`;
  try{
    const r = await fetch(CSV_URL, {cache: "no-store"});
    if(!r.ok) throw new Error("http");
    const t = await r.text(); setWords(t); lsSet(LS_CACHE, t);
  }catch(e){
    const c = lsGet(LS_CACHE, null);
    try{ if(!c) throw e; setWords(c); notice = "Sin conexión: usando la última copia guardada."; }
    catch(_){ app.innerHTML = `<p class="hint">No se pudo cargar el vocabulario. Comprueba la conexión y recarga la página.</p>`; return; }
  }
  if(!words.length){ app.innerHTML = `<p class="hint">Todavía no hay palabras en la hoja.</p>`; return; }
  sel = new Set(units); home();
}
load();
</script>
</body>
</html>
